<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌戰三國・直播亂鬥</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC","WenQuanYi Zen Hei",sans-serif; }
  body { display: flex; }
  #stage-wrap { flex: 1; min-width: 0; position: relative;
    /* 試玩模式的格子底，用來示意「這裡是透明的」。OBS 模式不會有 */
    background: repeating-conic-gradient(#3a4046 0% 25%, #30353a 0% 50%) 0 0 / 32px 32px; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { width: 330px; flex: none; box-sizing: border-box; padding: 12px 14px; overflow-y: auto;
    background: #F7F1E3; color: #3E4A46; border-left: 3px solid #E3D9BE; font-size: 14px; }
  /* TikTok 連線狀態（左下角小字） */
  #link-status { display: none; position: absolute; left: 10px; bottom: 8px; padding: 4px 10px; border-radius: 8px;
    background: rgba(0,0,0,0.7); color: #fff; font-size: 13px; }
  body.obs #panel { display: none; }
  body.obs #stage-wrap { background: transparent; }

  /* ---- 面板：分組、可收合的卡片 ---- */
  #panel { padding: 0 12px 24px; }
  #panel .topbar { position: sticky; top: 0; z-index: 5; margin: 0 -12px 8px; padding: 10px 12px 8px;
    background: linear-gradient(#F7F1E3 85%, rgba(247,241,227,0)); }
  #panel h1 { font-size: 17px; margin: 0 0 6px; letter-spacing: 0.5px; }
  #panel h1 small { font-size: 11px; font-weight: normal; color: #8C9490; margin-left: 4px; }
  #panel .topbtns { display: flex; gap: 6px; }
  #panel .topbtns button { padding: 4px 8px; font-size: 12px; border-radius: 14px; background: #fff; }
  #panel .group { margin: 14px 2px 6px; font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #8C9490;
    display: flex; align-items: center; gap: 8px; }
  #panel .group::after { content: ''; flex: 1; height: 1.5px; background: #E3D9BE; }
  #panel details.card { background: #fff; border: 1.5px solid #E3D9BE; border-radius: 12px; margin-bottom: 8px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(62,74,70,0.04); transition: border-color .15s; }
  #panel details.card[open] { border-color: #D9B79A; }
  #panel details.card.pinned { border-color: #D9563E; background: #FFFBF3; }
  #panel details.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; font-weight: bold; font-size: 14px; user-select: none; }
  #panel details.card > summary::-webkit-details-marker { display: none; }
  #panel details.card > summary::after { content: '›'; margin-left: auto; font-size: 20px; line-height: 1; color: #8C9490;
    transition: transform .15s; }
  #panel details.card[open] > summary::after { transform: rotate(90deg); }
  #panel details.card > summary:hover { background: #FBF7EC; }
  #panel details.card > summary .ico { font-size: 17px; flex: none; }
  #panel details.card > summary em { font-style: normal; font-weight: normal; font-size: 11.5px; color: #8C9490; margin-left: 2px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel details.card > summary:has(em:empty) em { display: none; }
  #panel .body { padding: 2px 12px 12px; border-top: 1.5px dashed #EFE6CF; }
  #panel .sub { margin: 12px 0 6px; font-size: 12.5px; font-weight: bold; color: #B23F2B; }
  #panel .sub.first { margin-top: 8px; }
  #panel .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #panel .row:last-child { margin-bottom: 0; }
  #panel select, #panel input { flex: 1; min-width: 0; font: inherit; padding: 6px; border: 1.5px solid #E3D9BE; border-radius: 6px; background: #fff; color: inherit; }
  #panel button { flex: 1; font: inherit; padding: 7px 8px; border: 1.5px solid #E3D9BE; border-radius: 8px;
    background: #F2ECDA; color: inherit; cursor: pointer; white-space: nowrap; }
  #panel button:hover { border-color: #D9563E; }
  #panel button:active { transform: translateY(1px); }
  #panel button.main { background: #D9563E; border-color: #B23F2B; color: #fff; }
  #panel .gifts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #panel .gifts button { padding: 10px 4px; font-size: 15px; white-space: normal; }
  #panel .gifts small { display: block; font-size: 12px; color: #8C9490; }
  #panel .hint { font-size: 12px; color: #8C9490; line-height: 1.5; margin: 4px 0 6px; }
  #panel .gs-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #panel .gs-row b { flex: none; width: 74px; }
  #panel .seen { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 13px; }
  #panel .seen span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .seen select { flex: none; width: 108px; padding: 3px; }
  #panel label.opt { display: block; margin: 3px 0; cursor: pointer; font-size: 13px; }
  #panel label.opt input { flex: none; width: auto; margin-right: 4px; }
  #panel #gs-url { font-size: 11px; }
  #p-log { max-height: 160px; overflow-y: auto; font-size: 12px; color: #8C9490; line-height: 1.6; }
</style>
</head>
<body>
  <div id="stage-wrap"><canvas id="stage"></canvas><div id="link-status"></div></div>
  <div id="panel"></div>

  <script src="js/config.js"></script>
  <script src="data/heroes.js"></script>
  <script src="data/extra-heroes.js"></script>
  <script src="js/events.js"></script>
  <script src="js/gift-settings.js"></script>
  <script src="js/save.js"></script>
  <script src="js/cloud-save.js"></script>
  <script src="js/game.js"></script>
  <script src="js/hero-sprite.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/arenas.js"></script>
  <script src="js/render.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
