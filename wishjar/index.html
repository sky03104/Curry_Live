<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>禮物許願碗</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  body:not(.obs){background:#20232c}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #panel{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:300px;z-index:5}
  body.obs #panel{display:none}
  #panel button,#panel select{font:inherit;font-size:13px;padding:6px 9px;border-radius:7px;border:1px solid #555;background:#2f3440;color:#fff;cursor:pointer}
  #status{position:fixed;left:8px;bottom:6px;font-size:12px;color:#aab;z-index:5}
  body.obs #status{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel">
  <select id="dia"><option value="1">1 鑽（小）</option><option value="10">10 鑽</option><option value="100" selected>100 鑽</option><option value="1000">1000 鑽</option><option value="10000">10000 鑽（大）</option></select>
  <button id="b1">丟 1 個</button>
  <button id="b20">丟 20 個</button>
  <button id="bc">清空瓶子</button>
</div>
<div id="status">TikFinity：未連線</div>
<script src="matter.min.js"></script>
<script src="bowls.js"></script>
<script>
(function () {
'use strict';
var P = new URLSearchParams(location.search);
var OBS = P.get('obs') === '1';
if (OBS) document.body.classList.add('obs');

/* ---------- 設定（都可以用網址參數改，預設值夠用） ---------- */
var CFG = {
  max: clampNum(P.get('max'), 20, 800, 350),       // 畫面上最多同時有幾個禮物（超過會把最早的拿掉）
  cap: clampNum(P.get('cap'), 1, 100, 25),         // 一次送禮最多掉幾個（連送 99 個也只掉這麼多）
  title: P.get('title') || '',                     // 碗上方的標題，預設不顯示；想要就加 &title=文字
  stats: P.get('stats') === '1',                   // 預設不顯示禮物個數與鑽石數；想要就加 &stats=1
  coin: P.get('coin') === '1',                     // 預設用觀眾送的禮物自己的圖片；&coin=1 改成全部畫成金黃色銅錢
  host: String(P.get('host') || '').split(/[,，、;；\s]+/).map(function (x) { return x.replace(/^@/, '').trim().toLowerCase(); }).filter(Boolean),   // 主播（管理員）的 TikTok 帳號，可填多個：&host=帳號1,帳號2
  tiktokfinity: P.get('tikfinity') !== '0'         // &tikfinity=0 可以關掉連線（只用測試按鈕）
};
function clampNum(v, lo, hi, def) { v = parseFloat(v); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }

/* ---------- 物理世界 ---------- */
var M = Matter, Engine = M.Engine, Bodies = M.Bodies, Body = M.Body, World = M.World;
var engine = Engine.create({ gravity: { x: 0, y: 0.32 } });
var world = engine.world;
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1, K = 1;
var jar = { cx: 0, w: 0, h: 0, bottom: 0, wall: 14 };   // 瓶子的位置與大小
var statics = [];
var items = [];                // 掉進來的禮物 { body, img(url), size, born }
var stats = { count: 0, diamonds: 0 };

/* ---------- 碗的圖片（後半：碗口內側＋碗身；前半：碗身前面那層，半透明蓋在禮物上）；用 &bowl=代號 選碗，清單在 bowls.js ---------- */
var BOWL = { back: new Image(), front: new Image(), ok: 0, U: 260, cx: 127, cy: 88, openW: 222, depth: 0.428, foot: 0.0405 };
(function () {
  var list = window.WJ_BOWLS || [], want = P.get('bowl'), b = null;
  list.forEach(function (x) { if (x.id === want) b = x; });
  b = b || list[0];
  if (b) { ['U', 'cx', 'cy', 'openW', 'depth', 'foot'].forEach(function (k) { if (b[k] != null) BOWL[k] = b[k]; }); }
  ['back', 'front'].forEach(function (k) {
    BOWL[k].onload = function () { BOWL.ok++; };
    BOWL[k].src = b ? b[k] : 'bowl_' + k + '.png';
  });
})();

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // 碗：上面是寬寬的碗口，往下收成半橢圓的碗身，底下一個小圈足。碗深＝碗寬的一半
  jar.w = Math.min(W * 0.86, H * 0.55 / (BOWL.depth + BOWL.foot));        // 碗盡量撐滿寬度，上面留空間給禮物掉下來；兩旁留一點空位給滿出來的禮物
  jar.depth = jar.w * BOWL.depth;                           // 碗深、圈足高度都照碗圖片的比例
  jar.foot = jar.w * BOWL.foot;
  jar.h = jar.depth + jar.foot;
  K = jar.w / 300;
  jar.cx = W * 0.5;
  jar.bottom = H - 16;
  jar.wall = Math.max(10, 12 * K);
  jar.neckW = jar.w * 0.75;
  jar.rimH = 0;
  statics.forEach(function (b) { World.remove(world, b); });
  statics = [];
  var t = jar.wall, cx = jar.cx, T = jar.bottom - jar.h, a = jar.w / 2 + t / 2, b = jar.depth + t / 2;
  var opt = { isStatic: true, friction: 0.4, restitution: 0.1 };
  function seg(x1, y1, x2, y2) {
    var len = Math.hypot(x2 - x1, y2 - y1);
    return Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len + t * 0.6, t, Object.assign({ angle: Math.atan2(y2 - y1, x2 - x1) }, opt));
  }
  var N = 30, prev = null;                                    // 半橢圓碗身：用一小段一小段的牆圍起來
  for (var k = 0; k <= N; k++) {
    var th = Math.PI * k / N, px = cx + a * Math.cos(th), py = T + b * Math.sin(th);
    if (prev) statics.push(seg(prev[0], prev[1], px, py));
    prev = [px, py];
  }
  statics.push(
    Bodies.circle(cx - a, T, t * 0.6, opt), Bodies.circle(cx + a, T, t * 0.6, opt),                    // 碗口圓邊：滿出來的禮物會順著滑到碗旁邊
    Bodies.rectangle(W / 2, H + 40, W * 3, 80, opt),                                                  // 地板
    Bodies.rectangle(-40, H / 2, 80, H * 3, opt), Bodies.rectangle(W + 40, H / 2, 80, H * 3, opt)   // 左右牆
  );
  World.add(world, statics);
}
window.addEventListener('resize', layout);
layout();

function bowlDraw(img, alpha) {
  var s = jar.w / BOWL.openW, T = jar.bottom - jar.h, d = BOWL.U * s;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(img, jar.cx - BOWL.cx * s, T - BOWL.cy * s, d, d);
  ctx.restore();
}

/* ---------- 銅錢圖（程式畫的，先畫好存起來） ---------- */
var COIN_TONES = [['#fff4b0', '#f7c92b', '#b8860b'], ['#ffe98a', '#efb81c', '#a87408'], ['#fff0a0', '#ffd24a', '#c28a10']];
var coinSprites = COIN_TONES.map(function (tone) {
  var S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  var g = c.getContext('2d'), R = S / 2 - 3, m = S / 2;
  var rg = g.createRadialGradient(m - R * 0.3, m - R * 0.3, R * 0.1, m, m, R);
  rg.addColorStop(0, tone[0]); rg.addColorStop(0.55, tone[1]); rg.addColorStop(1, tone[2]);
  g.beginPath(); g.arc(m, m, R, 0, 7); g.fillStyle = rg; g.fill();
  g.lineWidth = 4; g.strokeStyle = '#8a5a00'; g.stroke();                       // 外緣
  g.beginPath(); g.arc(m, m, R * 0.84, 0, 7); g.lineWidth = 3; g.strokeStyle = 'rgba(138,90,0,.7)'; g.stroke();   // 內圈
  var h = R * 0.36;                                                              // 中間的方孔
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillRect(m - h, m - h, h * 2, h * 2); g.restore();
  g.lineWidth = 4; g.strokeStyle = '#8a5a00'; g.strokeRect(m - h, m - h, h * 2, h * 2);
  g.fillStyle = 'rgba(138,90,0,.75)';                                            // 上下左右四個小記號（像錢幣上的字）
  var d = R * 0.6, w = R * 0.16;
  g.fillRect(m - w, m - d - w, w * 2, w * 1.6); g.fillRect(m - w, m + d - w * 0.6, w * 2, w * 1.6);
  g.fillRect(m - d - w, m - w, w * 1.6, w * 2); g.fillRect(m + d - w * 0.6, m - w, w * 1.6, w * 2);
  g.beginPath(); g.arc(m, m, R, Math.PI * 1.05, Math.PI * 1.45);                 // 高光
  g.lineWidth = 6; g.lineCap = 'round'; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
  return c;
});

/* ---------- 禮物圖片 ---------- */
var imgCache = new Map();
var FALLBACK = ['🎁', '🌹', '💎', '🧸', '⭐', '🍭', '💖', '🎈'];
function getImg(url) {
  if (!url) return null;
  var e = imgCache.get(url);
  if (e) return e.ok ? e.img : null;
  var img = new Image();
  e = { img: img, ok: false };
  img.referrerPolicy = 'no-referrer';
  img.onload = function () { e.ok = true; };
  img.onerror = function () { e.ok = false; };
  img.src = url;
  imgCache.set(url, e);
  if (imgCache.size > 300) imgCache.delete(imgCache.keys().next().value);
  return null;
}
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

/* ---------- 丟一個禮物進瓶子 ---------- */
function sizeFor(diamonds) {
  var d = Math.max(1, diamonds || 1);
  return Math.min(0.26, 0.10 + 0.03 * Math.log10(d + 1)) * jar.w;     // 1 鑽≈碗寬的 11%、100 鑽≈16%、1000 鑽≈19%、10000 鑽≈22%
}
function spawn(gift) {
  var size = sizeFor(gift.diamonds);
  var r = size * 0.46;
  var spread = Math.random() < 0.8 ? jar.neckW * 0.36 : jar.neckW * 0.75;   // 大多掉進瓶口，偶爾偏一點掉到瓶子外面
  var x = jar.cx + (Math.random() * 2 - 1) * spread;
  var y = -size;
  var b = Bodies.circle(x, y, r, { restitution: 0.25, friction: 0.35, frictionAir: 0.02, density: 0.002, slop: 0.05 });
  Body.setVelocity(b, { x: (Math.random() - 0.5) * 2, y: 2 + Math.random() * 3 });
  Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.2);
  World.add(world, b);
  items.push({ body: b, coin: Math.floor(Math.random() * coinSprites.length), url: gift.icon || '', size: size, emoji: FALLBACK[hash(gift.name || '') % FALLBACK.length], born: performance.now() });
  stats.count++; stats.diamonds += gift.diamonds || 0;
  trim();
}
function inJar(b) { return Math.abs(b.position.x - jar.cx) < jar.w / 2 && b.position.y > jar.bottom - jar.h; }
function trim() {
  while (items.length > CFG.max) {                                   // 太多時先拿掉瓶子外面最早的，沒有再拿最早的
    var i = items.findIndex(function (it) { return !inJar(it.body) && performance.now() - it.born > 4000; });
    if (i < 0) i = 0;
    World.remove(world, items[i].body);
    items.splice(i, 1);
  }
}
function drop(name, diamonds, count, icon) {
  var n = Math.max(1, Math.min(CFG.cap, Math.floor(count || 1)));
  var g = { name: name || '', diamonds: diamonds || 0, icon: icon || '' };
  if (!CFG.coin) getImg(g.icon);
  for (var i = 0; i < n; i++) (function (k) { setTimeout(function () { spawn(g); }, k * 110); })(i);
}
function clearAll() {
  items.forEach(function (it) { World.remove(world, it.body); });
  items.length = 0; stats.count = 0; stats.diamonds = 0;
}

/* ---------- 畫面 ---------- */
function bowlBody() {                // 碗身外形（半橢圓）
  ctx.beginPath(); ctx.ellipse(jar.cx, jar.bottom - jar.h, jar.w / 2, jar.depth, 0, 0, Math.PI); ctx.closePath();
}
function drawJarBack() {
  if (BOWL.ok >= 2) { bowlDraw(BOWL.back, 1); return; }             // 禮物後面：碗口裡面看到的內側
  var cx = jar.cx, T = jar.bottom - jar.h, rx = jar.w / 2, ry = jar.depth * 0.16;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, T, rx, ry, 0, 0, Math.PI * 2);
  var g = ctx.createLinearGradient(0, T - ry, 0, T + ry);
  g.addColorStop(0, 'rgba(235,245,252,.95)'); g.addColorStop(1, 'rgba(190,220,238,.95)');
  ctx.fillStyle = g; ctx.fill();
  // 碗身的淺藍色（畫在禮物後面，禮物才不會被染色）
  bowlBody();
  var g2 = ctx.createLinearGradient(0, T, 0, T + jar.depth);
  g2.addColorStop(0, 'rgba(140,200,230,.65)'); g2.addColorStop(1, 'rgba(95,165,205,.85)');
  ctx.fillStyle = g2; ctx.fill();
  ctx.restore();
}
function drawJar() {
  if (BOWL.ok >= 2) { bowlDraw(BOWL.front, 0.3); return; }                 // 禮物前面：半透明的碗身、碗口邊、圈足、高光
  var cx = jar.cx, T = jar.bottom - jar.h, rx = jar.w / 2, ry = jar.depth * 0.16, B = jar.bottom;
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // 圈足
  var fw = jar.w * 0.28, fh = jar.foot;
  ctx.beginPath(); ctx.moveTo(cx - fw / 2, B - fh); ctx.lineTo(cx - fw / 2 - 4 * K, B); ctx.lineTo(cx + fw / 2 + 4 * K, B); ctx.lineTo(cx + fw / 2, B - fh); ctx.closePath();
  ctx.fillStyle = 'rgba(110,170,205,.95)'; ctx.fill(); ctx.lineWidth = 3 * K; ctx.strokeStyle = '#2f6c93'; ctx.stroke();
  // 碗身外框
  bowlBody();
  ctx.fillStyle = 'rgba(200,230,245,.10)'; ctx.fill();                     // 前面一層很淡的玻璃感
  ctx.lineWidth = 4 * K; ctx.strokeStyle = '#2f6c93'; ctx.stroke();
  // 碗口前緣
  ctx.beginPath(); ctx.ellipse(cx, T, rx, ry, 0, 0, Math.PI); ctx.lineWidth = 4 * K; ctx.strokeStyle = '#2f6c93'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, T, rx, ry, 0, Math.PI, Math.PI * 2); ctx.lineWidth = 3 * K; ctx.strokeStyle = 'rgba(47,108,147,.8)'; ctx.stroke();
  // 高光
  ctx.beginPath(); ctx.ellipse(cx, T, rx * 0.86, jar.depth * 0.8, 0, Math.PI * 0.62, Math.PI * 0.86);
  ctx.lineWidth = 7 * K; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();
  ctx.restore();
}
function outlineText(txt, x, y, px, align) {
  ctx.font = '900 ' + px + 'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, px * 0.22); ctx.strokeStyle = '#000'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y);
}
function drawItem(it) {
  var b = it.body, s = it.size, img = CFG.coin ? null : getImg(it.url);
  ctx.save();
  ctx.globalAlpha = it.alpha == null ? 1 : it.alpha;
  ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  if (CFG.coin) {
    ctx.drawImage(coinSprites[it.coin], -s / 2, -s / 2, s, s);
  } else if (img) {
    ctx.drawImage(img, -s / 2, -s / 2, s, s);
  } else {                                                    // 沒有圖片（還沒收到圖片網址／載入失敗）時畫一顆圓圓的表情符號
    ctx.beginPath(); ctx.arc(0, 0, s * 0.46, 0, 7);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
    ctx.font = Math.round(s * 0.6) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(it.emoji, 0, s * 0.04);
  }
  ctx.restore();
}
var OUT_STAY = 7000, OUT_FADE = 1500;
function fadeOutside() {
  var now = performance.now();
  for (var i = items.length - 1; i >= 0; i--) {
    var it = items[i];
    if (inJar(it.body) || it.body.speed > 1.2) { it.outSince = 0; it.alpha = 1; continue; }   // 在碗裡，或還在掉（還沒停下來）的不算
    if (!it.outSince) it.outSince = now;
    var t = now - it.outSince - OUT_STAY;
    it.alpha = t <= 0 ? 1 : Math.max(0, 1 - t / OUT_FADE);
    if (it.alpha <= 0) { World.remove(world, it.body); items.splice(i, 1); }
  }
}
function frame() {
  var now = performance.now(), dt = Math.min(34, Math.max(8, now - (frame.last || now - 16)));   // 照真實經過的時間算，不管直播軟體跑 30 還是 60 格，掉落速度都一樣
  frame.last = now;
  Engine.update(engine, dt / 2); Engine.update(engine, dt / 2);          // 分兩小步算，比較不會穿過碗壁
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawJarBack();
  fadeOutside();
  for (var i = 0; i < items.length; i++) drawItem(items[i]);
  drawJar();
  // 瓶子上方的標題與累計（字用白色粗黑外框，直播壓縮後比較看得清楚）
  var ty = 34 * K;
  if (CFG.title) { outlineText(CFG.title, jar.cx, ty, 30 * K); ty += 28 * K; }
  if (CFG.stats) outlineText('🎁 ' + stats.count + ' 個　💎 ' + stats.diamonds.toLocaleString(), jar.cx, ty, 20 * K);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 接 TikFinity（禮物事件格式照亂鬥遊戲 js/events.js 的寫法） ---------- */
function findGiftImage(data) {
  var isUrl = function (v) { return typeof v === 'string' && /^https?:\/\/\S+$/.test(v) && /\.(png|webp|jpe?g|image|awebp)(\b|~|\?|$)|tiktokcdn|ibyteimg|byteimg/i.test(v); };
  var skip = /profile|avatar|badge|fans|follow|userdetail|^user$|touser|anchor|author/i, prefer = /gift|icon|image|picture/i, fb = '';
  (function walk(node, path, depth) {
    if (!node || depth > 6) return '';
    if (Array.isArray(node)) { for (var i = 0; i < node.length; i++) { var v = node[i]; if (isUrl(v)) { if (prefer.test(path)) return v; fb = fb || v; } else { var r = walk(v, path, depth + 1); if (r) return r; } } return ''; }
    if (typeof node !== 'object') return '';
    for (var k in node) {
      if (skip.test(k)) continue;
      var v2 = node[k], p = path + '.' + k;
      if (isUrl(v2)) { if (prefer.test(p)) { fb = v2; return v2; } fb = fb || v2; }
      else if (v2 && typeof v2 === 'object') { var r2 = walk(v2, p, depth + 1); if (r2) return r2; }
    }
    return '';
  })(data, '', 0);
  return fb;
}
var streaks = new Map();
function readGift(msg) {
  var d = msg.data || {};
  var u = d.user || d;
  var uid = String(u.userId || u.uniqueId || u.id || u.displayId || '');
  var layers = [d, d.giftDetails, d.gift, d.extendedGiftInfo].filter(function (x) { return x && typeof x === 'object'; });
  function pick() { for (var i = 0; i < layers.length; i++) for (var j = 0; j < arguments.length; j++) { var v = layers[i][arguments[j]]; if (v !== undefined && v !== null && v !== '') return v; } }
  var giftId = String(pick('giftId', 'gift_id', 'id') || '');
  var total = Number(pick('repeatCount', 'repeat_count')) || 1, count = total;
  if (Number(pick('giftType', 'gift_type', 'type')) === 1) {         // 連送：只算比上次多出來的
    var key = uid + '|' + giftId + '|' + (d.groupId || '');
    var ended = pick('repeatEnd', 'repeat_end');
    count = total - (streaks.get(key) || 0);
    if (ended && ended !== '0') streaks.delete(key); else streaks.set(key, total);
    if (streaks.size > 5000) streaks.clear();
  }
  if (count <= 0) return null;
  var first = function (l) { return (Array.isArray(l) && l[0]) || ''; }, E = d.extendedGiftInfo || {};
  var icon = String(d.giftPictureUrl || ((d.giftDetails || {}).giftImage || {}).giftPictureUrl ||
    first(((d.gift || {}).icon || {}).urlList) || first(((d.gift || {}).image || {}).urlList) ||
    first((E.icon || {}).url_list) || first((E.image || {}).url_list) || findGiftImage(d) || '');
  return { name: String(pick('giftName', 'name') || ''), diamonds: Number(pick('diamondCount', 'diamond_count')) || 0, count: count, icon: icon };
}
// 主播留言「清空許願碗」（也認「清空碗」「clear」）就把碗清空；只認 &host= 填的帳號（比對 TikTok 帳號代號，不比暱稱，別人改暱稱冒充不了）
var CMD_CLEAR = /^!?(清空許願碗|清空碗|clear)$/i;
function isHostMsg(d) {
  if (!CFG.host.length) return false;
  var u = d.user || {};
  var ids = [d.uniqueId, u.uniqueId, d.userId, u.userId, d.user_id, d.displayId, u.displayId].map(function (x) { return String(x || '').toLowerCase(); });
  return ids.some(function (x) { return x && CFG.host.indexOf(x) >= 0; });
}
function handleMsg(msg) {
  if (!msg) return;
  if (msg.event === 'gift') { var g = readGift(msg); if (g) drop(g.name, g.diamonds, g.count, g.icon); return; }
  if (msg.event === 'chat') {
    var d = msg.data || {}, text = String(d.comment || d.content || '').trim();
    if (CMD_CLEAR.test(text) && isHostMsg(d)) clearAll();
  }
}
var statusEl = document.getElementById('status');
function connect() {
  if (!CFG.tiktokfinity) { statusEl.textContent = 'TikFinity：已關閉（只能用測試按鈕）'; return; }
  var ws;
  try { ws = new WebSocket('ws://localhost:21213/'); } catch (e) { setTimeout(connect, 5000); return; }
  ws.onopen = function () { statusEl.textContent = 'TikFinity：已連線'; };
  ws.onmessage = function (e) {
    var msg; try { msg = JSON.parse(e.data); } catch (x) { return; }
    handleMsg(msg);
  };
  ws.onclose = function () { statusEl.textContent = 'TikFinity：未連線，重試中…'; setTimeout(connect, 3000); };
  ws.onerror = function () { try { ws.close(); } catch (x) {} };
}
connect();

/* ---------- 測試按鈕與測試用接口 ---------- */
var diaSel = document.getElementById('dia');
document.getElementById('b1').onclick = function () { drop('測試' + Math.floor(Math.random() * 8), +diaSel.value, 1, ''); };
document.getElementById('b20').onclick = function () { drop('測試' + Math.floor(Math.random() * 8), +diaSel.value, 20, ''); };
document.getElementById('bc').onclick = clearAll;
window.__jar = {
  drop: drop, clear: clearAll, onMsg: handleMsg, items: items, readGift: readGift, cfg: CFG,
  state: function () {
    var out = 0; items.forEach(function (it) { if (!inJar(it.body)) out++; });
    return { total: items.length, outside: out, inside: items.length - out, stats: stats, jar: jar, W: W, H: H };
  }
};
})();
</script>
