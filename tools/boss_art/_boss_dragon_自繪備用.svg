<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3aa5"/><stop offset="1" stop-color="#21114a"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e98d8"/><stop offset=".5" stop-color="#4f5798"/><stop offset="1" stop-color="#2b2f66"/></linearGradient>
  <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8b4ff"/><stop offset="1" stop-color="#7e4cc4"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fd8" stop-opacity=".95"/><stop offset="1" stop-color="#4a1590" stop-opacity=".95"/></linearGradient>
  <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6efff"/><stop offset="1" stop-color="#a98cd0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
