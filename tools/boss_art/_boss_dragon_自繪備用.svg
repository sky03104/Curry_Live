  <g filter="url(#glow)"><ellipse cx="156" cy="214" rx="17" ry="10" fill="#ff4fd8" transform="rotate(-20 156 214)"/></g>
  <ellipse cx="158" cy="214" rx="4" ry="9" fill="#2a0f4d" stroke="none" transform="rotate(-20 158 214)"/>
